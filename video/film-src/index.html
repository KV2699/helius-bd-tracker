<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Two grounds, never three. Bone with ink type, and full Helius red with
         white type. Nothing is black. Red is kept for the lines that land. */
      :root{
        --bone:#F1EEE7; --bone-2:#E8E4DA; --ink:#17181A; --ink-2:#5C5E63; --ink-3:#8A8880;
        --red:#E8412A; --line:#D8D3C7;
        --display:"Inter", sans-serif; --mono:"JetBrains Mono", monospace;
      }
      *{margin:0;padding:0;box-sizing:border-box}
      html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bone)}
      #root{width:100%;height:100%;position:relative;font-family:var(--display);background:var(--bone)}
      .host{position:absolute;inset:0}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90"
         data-width="1920" data-height="1080">

      <div id="splash" class="clip host" data-start="0" data-duration="4" data-track-index="0" data-track-kind="graphics" data-composition-id="splash" data-composition-src="compositions/splash.html" data-width="1920" data-height="1080"></div>
      <div id="open" class="clip host" data-start="4" data-duration="7" data-track-index="0" data-track-kind="graphics" data-composition-id="open" data-composition-src="compositions/open.html" data-width="1920" data-height="1080"></div>
      <div id="guess" class="clip host" data-start="11" data-duration="6" data-track-index="0" data-track-kind="graphics" data-composition-id="guess" data-composition-src="compositions/guess.html" data-width="1920" data-height="1080"></div>
      <div id="refuse" class="clip host" data-start="17" data-duration="11" data-track-index="0" data-track-kind="graphics" data-composition-id="refuse" data-composition-src="compositions/refuse.html" data-width="1920" data-height="1080"></div>
      <div id="ground" class="clip host" data-start="28" data-duration="14" data-track-index="0" data-track-kind="graphics" data-composition-id="ground" data-composition-src="compositions/ground.html" data-width="1920" data-height="1080"></div>
      <div id="auditterm" class="clip host" data-start="42" data-duration="8" data-track-index="0" data-track-kind="graphics" data-composition-id="audit-term" data-composition-src="compositions/audit-term.html" data-width="1920" data-height="1080"></div>
      <div id="audit" class="clip host" data-start="50" data-duration="14" data-track-index="0" data-track-kind="graphics" data-composition-id="audit" data-composition-src="compositions/audit.html" data-width="1920" data-height="1080"></div>
      <div id="chain" class="clip host" data-start="64" data-duration="14" data-track-index="0" data-track-kind="graphics" data-composition-id="chain" data-composition-src="compositions/chain.html" data-width="1920" data-height="1080"></div>
      <div id="close" class="clip host" data-start="78" data-duration="12" data-track-index="0" data-track-kind="graphics" data-composition-id="close" data-composition-src="compositions/close.html" data-width="1920" data-height="1080"></div>

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
