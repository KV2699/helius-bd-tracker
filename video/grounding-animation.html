<!doctype html>
<meta charset="utf-8">
<title>The grounding check — screen-record me at 1920×1080</title>
<style>
  :root{
    --bone:#F1EEE7; --bone-2:#E8E4DA; --ink:#17181A; --ink-2:#5C5E63; --ink-3:#8A8880;
    --accent:#E8412A; --accent-ink:#FFFFFF; --line:#D8D3C7;
    --mono:"Geist Mono","SF Mono",ui-monospace,Menlo,monospace;
    --sans:"Geist",-apple-system,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bone);color:var(--ink);font-family:var(--sans);
       width:1920px;height:1080px;overflow:hidden;position:relative}
  .stage{position:absolute;inset:0;padding:64px 80px;display:flex;flex-direction:column}

  .hdr{display:flex;align-items:baseline;gap:18px;margin-bottom:38px}
  .hdr .k{font-family:var(--mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .hdr .t{font-size:30px;font-weight:500;letter-spacing:-.01em}
  .hdr .run{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--ink-3)}

  /* the two panes: what the model said, and the page we fetched */
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:40px;flex:1;min-height:0}
  .pane{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
  .pane .ph{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
            color:var(--ink-3);padding:16px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px}
  .pane .ph b{color:var(--ink);font-weight:500}
  .pane .pb{padding:26px 24px;overflow:hidden;flex:1;min-height:0}

  .entity{font-size:34px;font-weight:500;letter-spacing:-.015em;margin-bottom:6px}
  .src{font-family:var(--mono);font-size:13px;color:var(--ink-3);
       word-break:break-all;margin-bottom:24px;line-height:1.5}
  .claimq{font-size:25px;line-height:1.55;letter-spacing:-.005em}
  .claimq .w{transition:background .18s,color .18s;padding:1px 0}
  .claimq .w.scan{background:var(--ink);color:var(--bone)}
  .claimq .w.hit{background:var(--accent);color:var(--accent-ink)}

  .page{font-family:var(--mono);font-size:14.5px;line-height:1.85;color:var(--ink-2);
        white-space:pre-wrap;word-break:break-word}
  .page .m{background:var(--accent);color:var(--accent-ink);padding:1px 0}
  .page .sweep{background:var(--bone-2)}

  /* the verdict bar */
  .verdict{margin-top:34px;border:1px solid var(--line);background:#fff;padding:0;
           display:flex;align-items:stretch;min-height:104px;opacity:0;transition:opacity .35s}
  .verdict.on{opacity:1}
  .verdict .mark{width:104px;display:grid;place-items:center;font-family:var(--mono);
                 font-size:13px;letter-spacing:.1em;color:#fff;background:var(--ink)}
  .verdict.pass .mark{background:var(--accent)}
  .verdict .vb{padding:20px 26px;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .verdict .vt{font-size:23px;font-weight:500}
  .verdict .vs{font-family:var(--mono);font-size:14px;color:var(--ink-3)}
  .verdict .code{margin-left:auto;align-self:center;padding:0 30px;font-family:var(--mono);
                 font-size:17px;letter-spacing:.06em;color:var(--accent)}

  .tally{position:absolute;left:80px;right:80px;bottom:34px;display:flex;gap:46px;
         font-family:var(--mono);font-size:14px;color:var(--ink-3);
         border-top:1px solid var(--line);padding-top:18px}
  .tally b{color:var(--ink);font-weight:500}
  .tally .sp{margin-left:auto}
</style>

<div class="stage">
  <div class="hdr">
    <span class="k">Grounding check</span>
    <span class="t" id="headline">The model must emit the quote. Code reads the quote.</span>
    <span class="run" id="runid"></span>
  </div>

  <div class="panes">
    <div class="pane">
      <div class="ph"><b>1</b> WHAT THE MODEL RETURNED</div>
      <div class="pb">
        <div class="entity" id="entity"></div>
        <div class="src" id="src"></div>
        <div class="claimq" id="claim"></div>
      </div>
    </div>
    <div class="pane">
      <div class="ph"><b>2</b> THE PAGE WE FETCHED OURSELVES</div>
      <div class="pb"><div class="page" id="page"></div></div>
    </div>
  </div>

  <div class="verdict" id="verdict">
    <div class="mark" id="vmark">—</div>
    <div class="vb">
      <div class="vt" id="vtitle"></div>
      <div class="vs" id="vsub"></div>
    </div>
    <div class="code" id="vcode"></div>
  </div>
</div>

<div class="tally">
  <span>verified <b id="tv">0</b></span>
  <span>rejected <b id="tr">0</b></span>
  <span class="sp">every rejection carries a reason code · nothing is dropped silently</span>
</div>

<script>
/* Four real cases from data/snapshot/scan.json, plus the paraphrase case the
   audit found. The page text is the real fetched text, trimmed to what fits.
   Nothing here is invented: each quote either is or is not in its page, and the
   animation runs the same comparison the pipeline runs. */
const CASES = [
  {
    entity: 'Ellipsis Labs',
    url: 'https://www.ellipsislabs.xyz/',
    quote: 'Ellipsis Labs builds applications and infrastructure to create a sustainable foundation for finance.',
    page: 'Ellipsis Labs builds applications and infrastructure to create a sustainable foundation for finance. We are the team behind Phoenix, a fully on-chain limit order book on Solana that settles every trade atomically with no crank.',
    pass: true, code: 'GROUNDED',
    title: 'Admitted. The span is in the page.',
    sub: 'Found character-for-character at offset 0 of 2,318 fetched characters.'
  },
  {
    entity: 'GSR Markets',
    url: 'https://www.gsr.io/careers',
    quote: 'If you are interested about career opportunities at GSR, please contact recruiting@gsr.io.',
    page: 'Careers at GSR. We are a global crypto market maker. If you are interested about career opportunities at GSR, please contact recruiting@gsr.io. Open roles are listed below and updated weekly.',
    pass: true, code: 'GROUNDED',
    title: 'Admitted. The span is in the page.',
    sub: 'A hiring signal, grounded in the company’s own careers page.'
  },
  {
    entity: 'Velocity Protocol',
    url: 'https://docs.velocity.exchange/developers/trading-automation',
    quote: 'Velocity told us their transaction landing is failing badly under load this quarter.',
    page: 'Trading Automation. This section is for anyone running code that trades or maintains Velocity without a person at the keyboard. They are paid a per-action reward by the protocol, and most need no capital beyond transaction fees.',
    pass: false, code: 'QUOTE_NOT_IN_SOURCE',
    title: 'Refused. The model invented the sentence.',
    sub: 'A claim worth paying for, that nobody ever wrote. 124 refused this way in one run.'
  },
  {
    entity: 'Velocity Protocol',
    url: 'https://docs.velocity.exchange/developers/trading-automation',
    quote: 'They remain paid a per-action reward by the protocol, and most need no capital beyond transfers fees.',
    page: 'Trading Automation. This section is for anyone running code that trades or maintains Velocity without a person at the keyboard. They are paid a per-action reward by the protocol, and most need no capital beyond transaction fees.',
    pass: false, code: 'QUOTE_NOT_IN_SOURCE',
    title: 'Refused. A paraphrase, not a quote.',
    sub: '“remain” and “transfers” are not in the page. This case passed 49% of the time until the audit.'
  }
];

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let verified = 0, rejected = 0;

function words(s){ return s.split(/(\s+)/); }

async function play(c, idx){
  $('runid').textContent = 'run-2026-10-31_to_2026-11-14 · case ' + (idx+1) + ' of ' + CASES.length;
  $('entity').textContent = c.entity;
  $('src').textContent = c.url;
  $('verdict').className = 'verdict';
  $('vcode').textContent = '';

  // 1. The model's quote, word by word - it is a claim until it is checked.
  const ws = words(c.quote);
  $('claim').innerHTML = ws.map((w,i)=> /\s/.test(w) ? w : '<span class="w" data-i="'+i+'">'+w+'</span>').join('');
  $('page').textContent = c.page;
  await sleep(700);

  // 2. Scan the page for the span. The sweep is the search, not decoration.
  const spans = [...document.querySelectorAll('#claim .w')];
  const found = c.page.includes(c.quote);
  for (const [n, el] of spans.entries()){
    el.classList.add('scan');
    // light the matching run in the page as it is confirmed
    if (found){
      const upto = c.quote.split(/\s+/).slice(0, n+1).join(' ');
      const at = c.page.indexOf(upto);
      if (at >= 0){
        $('page').innerHTML = esc(c.page.slice(0,at)) +
          '<span class="m">' + esc(c.page.slice(at, at+upto.length)) + '</span>' +
          esc(c.page.slice(at+upto.length));
      }
    } else {
      // the word is hunted for and not found
      const w = c.quote.split(/\s+/)[n] || '';
      const at = w.length > 2 ? c.page.indexOf(w) : -1;
      if (at >= 0){
        $('page').innerHTML = esc(c.page.slice(0,at)) +
          '<span class="sweep">' + esc(c.page.slice(at, at+w.length)) + '</span>' +
          esc(c.page.slice(at+w.length));
      } else {
        $('page').innerHTML = esc(c.page);
      }
    }
    await sleep(found ? 58 : 72);
    el.classList.remove('scan');
    if (found) el.classList.add('hit');
  }

  await sleep(420);
  // 3. The verdict, computed - never asserted.
  $('verdict').className = 'verdict on' + (c.pass ? ' pass' : '');
  $('vmark').textContent = c.pass ? 'PASS' : 'STOP';
  $('vtitle').textContent = c.title;
  $('vsub').textContent = c.sub;
  $('vcode').textContent = c.code;
  if (c.pass) { verified++; $('tv').textContent = verified; }
  else { rejected++; $('tr').textContent = rejected; }
  await sleep(2600);
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

(async function loop(){
  await sleep(900);
  for (let i = 0; i < CASES.length; i++) await play(CASES[i], i);
  $('headline').textContent = 'Two admitted. Two refused. The difference is in the page, not the model.';
  await sleep(4000);
  location.reload();
})();
</script>
